name: SpendSense APK

on:
  push:
    branches: [claude/android-spendsense-history-2kobp1]
    paths: ["SpendSense/**", ".github/workflows/spendsense-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpendSense
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpendSense-debug-apk
          path: SpendSense/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
